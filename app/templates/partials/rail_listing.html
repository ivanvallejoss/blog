<nav class="rail" aria-label="Filtros">
  <div class="rail-inner">
    <div class="rail-group">
      <p class="rail-label">TAGS</p>
      <div class="rail-list">
        {% for tag in tags %}
        <a class="rail-item rail-item--tag{% if tag.slug == active_tag %} is-active{% endif %}"
           {% if tag.slug == active_tag %}aria-current="page"{% endif %}
           href="{% if tag.slug %}{{ url_for('get_category', category_slug=tag.slug) }}{% else %}{{ url_for('post_list') }}{% endif %}">{{ tag.name }} · {{ tag.count }}</a>
        {% endfor %}
      </div>
    </div>

    {% for group in archive %}
    <div class="rail-group">
      <p class="rail-label">{{ group.year }}</p>
      <div class="rail-dates">
        {% for month in group.months %}
        <span>{{ month.label }} · {{ month.count }}</span>
        {% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>
</nav>
