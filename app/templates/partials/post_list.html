<ul class="post-list" id="post-list">
  {% for post in posts %}
  <li class="post-item">
    <div class="post-meta">
      <time class="meta" datetime="{{ post.published_at.isoformat() }}">
        {{ post.published_at | format_date }}
      </time>
      <a href="{{ url_for('get_category', category_slug=post.category.slug) }}"
         class="tag"
         hx-get="{{ url_for('get_category', category_slug=post.category.slug) }}"
         hx-target="#post-list"
         hx-swap="outerHTML"
         hx-push-url="true">
        {{ post.category.name }}
      </a>
    </div>
    <a href="{{ url_for('get_post', category_slug=post.category.slug, post_slug=post.slug) }}"
       class="post-title-link">
      {{ post.title }}
    </a>
  </li>
  {% endfor %}

  {% if not posts %}
  <li class="post-item">
    <p class="meta">No hay posts publicados todavía.</p>
  </li>
  {% endif %}
</ul>
