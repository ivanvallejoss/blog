{% extends "base.html" %}

{% block title %}Error {{ status_code }} — ivan.dev{% endblock %}

{% block content %}
<div class="error-page">
  <span class="error-code">{{ status_code }}</span>
  <h1>Algo salió mal</h1>
  <p>{{ detail or "Error inesperado. Intentá de nuevo más tarde." }}</p>
  <a href="{{ url_for('post_list') }}">Volver al inicio →</a>
</div>
{% endblock %}
